<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a12">
  <title>Minhas Cotas — Rifa do Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="12" y1="9" x2="12" y2="15"/><circle cx="17.5" cy="10.5" r="1" fill="#fff" stroke="none"/><circle cx="17.5" cy="13.5" r="1" fill="#fff" stroke="none"/></svg>
    </div>
    <div>
      <span class="brand-name">Rifa do Play</span>
      <span class="brand-sub">Consulta de cotas</span>
    </div>
  </div>
  <nav class="header-nav">
    <a href="/">Início</a>
  </nav>
</header>

<div class="section">
  <div style="margin-bottom:20px">
    <div class="page-title">Consultar minhas cotas</div>
    <p class="page-sub">Digite seu WhatsApp para ver as cotas associadas ao seu número.</p>
  </div>

  <div class="form-card" style="margin-bottom:16px">
    <div style="display:flex;gap:8px">
      <input id="phoneInput" type="tel" placeholder="(99) 99999-9999" style="flex:1" autocomplete="tel">
      <button class="btn btn-primary" id="btnBuscar" style="width:auto;white-space:nowrap">Consultar</button>
    </div>
  </div>

  <div id="result"></div>
</div>

<div class="footer-nav">
  <a href="/">Voltar ao início</a>
</div>

<script src="/verificar.js"></script>
</body>
</html>
