<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d1a">
  <title>Rifa do Play</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>

<header>
  <h1>🎮 Rifa do Play</h1>
  <p id="prizeDesc">PS5 Slim + GTA VI</p>
</header>

<div class="stats-bar">
  <div class="stat-chip"><span class="dot dot-available"></span><span id="statAvail">–</span> disponíveis</div>
  <div class="stat-chip"><span class="dot dot-reserved"></span><span id="statRes">–</span> reservadas</div>
  <div class="stat-chip"><span class="dot dot-paid"></span><span id="statPaid">–</span> pagas</div>
</div>

<div id="winnerBanner" style="display:none" class="section">
  <div class="winner-banner">
    <h2>🏆 Sorteio Realizado!</h2>
    <p id="winnerInfo"></p>
  </div>
</div>

<div class="section">
  <div class="legend">
    <div class="legend-item"><div class="legend-box available"></div> Disponível</div>
    <div class="legend-item"><div class="legend-box selected"></div> Selecionada</div>
    <div class="legend-item"><div class="legend-box reserved"></div> Reservada</div>
    <div class="legend-item"><div class="legend-box paid"></div> Paga</div>
  </div>

  <div class="grid-header">
    <h2>Escolha suas cotas</h2>
    <span class="selected-count" id="selCount"></span>
  </div>

  <div class="ticket-grid" id="ticketGrid">
    <div class="spinner"></div>
  </div>

  <div id="formSection" style="display:none">
    <h3>Seus dados</h3>
    <div id="selectedPreview" class="selected-preview">Nenhuma cota selecionada</div>
    <div class="form-group">
      <label>Nome completo *</label>
      <input id="inputName" type="text" placeholder="Seu nome" autocomplete="name">
    </div>
    <div class="form-group">
      <label>WhatsApp *</label>
      <input id="inputPhone" type="tel" placeholder="(99) 99999-9999" autocomplete="tel">
    </div>
    <div class="form-group">
      <label>E-mail (opcional)</label>
      <input id="inputEmail" type="email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="total-line">
      <span>Total</span>
      <span class="amount" id="totalAmount">R$ 0,00</span>
    </div>
    <div id="formError" class="alert alert-error" style="display:none"></div>
    <button class="btn btn-primary" id="btnReservar">🛒 Reservar cotas e ver PIX</button>
  </div>
</div>

<div class="nav-links">
  <a href="/verificar.html">🔍 Minhas cotas</a>
  <a href="/admin.html">🔐 Admin</a>
</div>

<script src="/app.js"></script>
</body>
</html>
